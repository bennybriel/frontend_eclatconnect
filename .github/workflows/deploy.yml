name: Deploy Frontend - Eclat Connect (frontend.eclatconnect.com)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-frontend-eclatconnect
  cancel-in-progress: false

jobs:
  validate:
    name: Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check & Production Build
        run: |
          npx tsc --noEmit
          npm run build

  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST || secrets.PROD_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.PROD_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.PROD_SSH_KEY }}
          password: ${{ secrets.SERVER_PASSWORD || secrets.PROD_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || secrets.PROD_SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "==== Deploying Eclat Connect Frontend to frontend.eclatconnect.com ===="
            TARGET_DIR="${{ secrets.FRONTEND_DEPLOY_PATH || '/opt/eclatconnect/Frontends/frontend_eclatconnect' }}"
            
            # Ensure target directory exists
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"

            # Pull latest changes or clone if first run
            if [ -d .git ]; then
              git fetch origin main
              git reset --hard origin/main
            else
              git clone https://github.com/bennybriel/frontend_eclatconnect.git .
            fi

            # Make deploy script executable and execute
            chmod +x deploy.sh
            ./deploy.sh
