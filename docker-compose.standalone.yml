# =====================================================================
# Eclat Connect Frontend — Standalone Docker Compose (No external network)
# =====================================================================

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: eclatconnect-frontend:latest
    container_name: eclat-frontend-standalone
    restart: unless-stopped
    ports:
      - "${PORT:-3090}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
